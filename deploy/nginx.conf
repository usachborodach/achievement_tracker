# ============================================================
#  Achievement Tracker — единый конфиг Nginx (домен + HTTPS)
# ============================================================

# ---------- ЗОНЫ ЛИМИТОВ ----------
limit_req_zone $binary_remote_addr zone=achievement_zone:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=achievement_conn:10m;

# ---------- КАРТЫ ДЛЯ БЛОКИРОВОК ----------
map $http_user_agent $blocked_agent {
    default                                             0;
    "~*(censys|shodan|nmap|masscan|zgrab|nikto|sqlmap)" 1;
    ""                                                  1;
}

map $request_uri $is_absolute_uri {
    default 0;
    "~*^https?://" 1;
}

# ============================================================
#  HTTP → HTTPS редирект
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name achievementtracker.usachborodach.ru;

    # Отдаём acme-challenge через общий конфиг, остальное редиректим
    location ~ ^/.well-known/(acme-challenge|pki-validation)/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
#  HTTPS
# ============================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name achievementtracker.usachborodach.ru;

    # Сертификаты
    ssl_certificate     /etc/nginx/ssl/achievementtracker.usachborodach.ru.crt;
    ssl_certificate_key /etc/nginx/ssl/achievementtracker.usachborodach.ru.key;

    # Современные настройки TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Заголовок для безопасности (защита от MIME-sniffing)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Логи
    access_log /var/log/nginx/achievement_tracker.access.log;
    error_log  /var/log/nginx/achievement_tracker.error.log warn;

    # Ограничения на запрос
    client_max_body_size   1m;
    client_body_timeout    15s;
    client_header_timeout  15s;

    # ---------- ЗАЩИТА ----------
    if ($blocked_agent) {
        return 444;
    }
    if ($is_absolute_uri) {
        return 444;
    }
    if ($request_method !~ ^(GET|POST|HEAD|OPTIONS)$) {
        return 444;
    }

    # ---------- ПРОКСИРОВАНИЕ НА GUNICORN ----------
    location / {
        limit_req  zone=achievement_zone burst=50 nodelay;
        limit_conn achievement_conn 20;

        proxy_pass http://127.0.0.1:8004;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }
}