<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.png') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>achievement tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a1a; color: #e0e0e0; }
        .navbar { background-color: #2d2d2d !important; border-bottom: 1px solid #3a3a3a; }
        .navbar-brand, .navbar-text { color: #e0e0e0 !important; }
        .btn-outline-light { border-color: #4a4a4a; color: #e0e0e0; }
        .btn-outline-light:hover { background-color: #3a3a3a; }
        .btn-outline-secondary { border-color: #4a4a4a; color: #b0b0b0; }
        .btn-outline-secondary:hover { background-color: #3a3a3a; color: #fff; }
        .btn-outline-primary { border-color: #0d6efd; color: #0d6efd; }
        .btn-outline-primary:hover { background-color: #0d6efd; color: #fff; }
        .btn-success { background-color: #198754; border-color: #198754; }
        .btn-success:hover { background-color: #157347; }
        .card { background-color: #2d2d2d; border: 1px solid #3a3a3a; border-radius: 8px; }
        .card-header { background-color: #3a3a3a; border-bottom: 1px solid #4a4a4a; color: #d0d0d0; }
        .form-control {
            background-color: #3a3a3a;
            border: 1px solid #4a4a4a;
            color: #e0e0e0;
            resize: vertical;
            /* высота определяется атрибутом rows */
        }
        .form-control:focus {
            background-color: #4a4a4a;
            border-color: #6c757d;
            color: #fff;
        }
        .text-muted { color: #888888 !important; }
        .row-cols-md-3 .col { margin-bottom: 1rem; }
        @media (max-width: 576px) {
            .form-control { font-size: 0.9rem; }
            .btn { font-size: 0.8rem; }
        }
        .save-indicator {
            font-size: 0.8rem;
            color: #6c757d;
            margin-left: 10px;
        }
        .save-indicator.saved { color: #28a745; }
        .save-indicator.saving { color: #ffc107; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <span class="navbar-brand">achievement tracker</span>
            <div class="d-flex align-items-center">
                <span class="navbar-text me-3">{{ date.strftime('%d.%m.%Y') }}</span>
                <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm">Выйти</a>
            </div>
        </div>
    </nav>

    <div class="container mt-3">
        <!-- Навигация по дням -->
        <div class="row mb-3">
            <div class="col-12">
                <div class="btn-group w-100" role="group">
                    <a href="{{ url_for('index', date=(date - timedelta(days=1)).strftime('%Y-%m-%d')) }}" class="btn btn-outline-secondary">&laquo; Предыдущий</a>
                    <a href="{{ url_for('index') }}" class="btn btn-outline-primary">Сегодня</a>
                    <a href="{{ url_for('index', date=(date + timedelta(days=1)).strftime('%Y-%m-%d')) }}" class="btn btn-outline-secondary">Следующий &raquo;</a>
                </div>
            </div>
        </div>

        <!-- Три колонки -->
        <div class="row row-cols-1 row-cols-md-3 g-4">
            {% for key, label in categories.items() %}
            <div class="col">
                <div class="card h-100">
                    <div class="card-header text-center fw-bold">{{ label }}</div>
                    <div class="card-body">
                        <textarea class="form-control achievement-text" data-category="{{ key }}" rows="10"
                                  placeholder="Введите достижения за день...">{{ doc[key] or '' }}</textarea>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>

        <!-- Индикатор сохранения и кнопка "Сохранить всё" -->
        <div class="row mt-3">
            <div class="col-12 d-flex justify-content-between align-items-center">
                <span id="saveIndicator" class="save-indicator">✔ Всё сохранено</span>
                <button id="saveAllBtn" class="btn btn-success btn-sm">Сохранить всё</button>
            </div>
        </div>

        <div class="text-muted small mt-2">
            <i>Изменения сохраняются автоматически через 1 секунду после окончания ввода.</i>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const date = '{{ date.strftime("%Y-%m-%d") }}';
            const textareas = document.querySelectorAll('.achievement-text');
            const indicator = document.getElementById('saveIndicator');

            function saveCategory(category, text) {
                return fetch('/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ date: date, category: category, text: text })
                })
                .then(response => response.json())
                .then(data => {
                    if (!data.success) {
                        console.warn('Ошибка сохранения для', category, data.message);
                        return false;
                    }
                    return true;
                })
                .catch(error => {
                    console.error('Ошибка сети:', error);
                    return false;
                });
            }

            function setIndicator(state, message) {
                indicator.textContent = message;
                indicator.className = 'save-indicator ' + state;
            }

            document.getElementById('saveAllBtn').addEventListener('click', function() {
                setIndicator('saving', '⏳ Сохранение...');
                const promises = [];
                textareas.forEach(ta => {
                    const cat = ta.dataset.category;
                    const val = ta.value;
                    promises.push(saveCategory(cat, val));
                });
                Promise.all(promises).then(results => {
                    const ok = results.every(r => r === true);
                    if (ok) {
                        setIndicator('saved', '✔ Всё сохранено');
                    } else {
                        setIndicator('', '⚠ Часть данных не сохранена (проверьте консоль)');
                    }
                });
            });

            let timeout = null;
            textareas.forEach(ta => {
                ta.addEventListener('input', function() {
                    clearTimeout(timeout);
                    setIndicator('saving', '⏳ Сохранение...');
                    const category = this.dataset.category;
                    const text = this.value;
                    timeout = setTimeout(() => {
                        saveCategory(category, text).then(success => {
                            if (success) {
                                setIndicator('saved', '✔ Всё сохранено');
                            } else {
                                setIndicator('', '⚠ Ошибка сохранения');
                            }
                        });
                    }, 1000);
                });
            });

            setIndicator('saved', '✔ Всё сохранено');
        });
    </script>
</body>
</html>
