<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.png') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}achievement_tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* ---------- Общие стили ---------- */
        body { background-color: #1a1a1a; color: #e0e0e0; }

        .card {
            background-color: #2d2d2d;
            border: 1px solid #3a3a3a;
            border-radius: 12px;
        }
        .card-header {
            background-color: #3a3a3a;
            border-bottom: 1px solid #4a4a4a;
            color: #d0d0d0;
        }

        .form-control {
            background-color: #3a3a3a;
            border: 1px solid #4a4a4a;
            color: #e0e0e0;
        }
        .form-control:focus {
            background-color: #4a4a4a;
            border-color: #6c757d;
            color: #fff;
        }

        .btn-primary       { background-color: #0d6efd; border-color: #0d6efd; }
        .btn-primary:hover { background-color: #0b5ed7; }
        .btn-success       { background-color: #198754; border-color: #198754; }
        .btn-success:hover { background-color: #157347; }

        .btn-outline-light      { border-color: #4a4a4a; color: #e0e0e0; }
        .btn-outline-light:hover { background-color: #3a3a3a; }
        .btn-outline-secondary      { border-color: #4a4a4a; color: #b0b0b0; }
        .btn-outline-secondary:hover { background-color: #3a3a3a; color: #fff; }
        .btn-outline-primary      { border-color: #0d6efd; color: #0d6efd; }
        .btn-outline-primary:hover { background-color: #0d6efd; color: #fff; }

        .alert { background-color: #3a3a3a; border-color: #4a4a4a; color: #f8f9fa; }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    {% block body %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
