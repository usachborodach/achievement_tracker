# 30 запросов в секунду на IP, память 10 МБ (~160k уникальных IP)
limit_req_zone $binary_remote_addr zone=achievement_zone:10m rate=30r/s;

# Ограничение одновременных соединений с одного IP
limit_conn_zone $binary_remote_addr zone=achievement_conn:10m;

# ---------- КАРТЫ ДЛЯ БЛОКИРОВОК (контекст http) ----------

# Подозрительные User-Agent → 1 (блокировать)
map $http_user_agent $blocked_agent {
    default                                             0;
    "~*(censys|shodan|nmap|masscan|zgrab|nikto|sqlmap)" 1;
    ""                                                  1;   # пустой UA
}

# Запросы с абсолютным URI (прокси-атаки, SOCKS5-подобные)
map $request_uri $is_absolute_uri {
    default 0;
    "~*^https?://" 1;
}

# ---------- САЙТ (контекст http, блок server) ----------

server {
    listen 84.54.57.22:8004;
    server_name _;

    # Логи
    access_log /var/log/nginx/achievement_tracker.access.log;
    error_log  /var/log/nginx/achievement_tracker.error.log warn;

    # Ограничения на размер и таймауты запроса от клиента
    client_max_body_size   1m;
    client_body_timeout    15s;
    client_header_timeout  15s;

    # ---------- ЗАЩИТА ----------

    # 1. Сканеры и пустые UA
    if ($blocked_agent) {
        return 444;
    }

    # 2. Прокси-атаки (абсолютный URI)
    if ($is_absolute_uri) {
        return 444;
    }

    # 3. Только безопасные HTTP-методы
    if ($request_method !~ ^(GET|POST|HEAD|OPTIONS)$) {
        return 444;
    }

    # ---------- ПРОКСИРОВАНИЕ НА GUNICORN ----------

    location / {
        # Лимиты
        limit_req  zone=achievement_zone burst=50 nodelay;
        limit_conn achievement_conn 20;

        # Апстрим
        proxy_pass http://127.0.0.1:8004;

        # Реальный IP клиента (Flask увидит его через ProxyFix)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # HTTP/1.1 + keep-alive до Gunicorn
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Таймауты
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Буферизация ответов
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }
}