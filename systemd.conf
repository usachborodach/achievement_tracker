[Unit]
Description=Achievement Tracker Flask Service
After=network.target

[Service]
User=root
Group=root
WorkingDirectory=/root/achievement_tracker
EnvironmentFile=/root/achievement_tracker/.env
ExecStartPre=/usr/bin/python3 /root/achievement_tracker/create_index.py
ExecStart=/usr/local/bin/gunicorn -w 2 --timeout 120 --access-logfile /var/log/achievement_tracker/access.log --error-logfile /var/log/achievement_tracker/error.log -b 127.0.0.1:8004 app:app
Restart=always
RestartSec=10

[Install]
WantedBy=multi-user.targets